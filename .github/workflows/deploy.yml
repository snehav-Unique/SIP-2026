name: Deploy updated code to production

on:
  push:
    branches:
      - disable-startup-notice

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd Main-Dashboard
            git fetch origin
            git checkout disable-startup-notice
            git pull origin disable-startup-notice
            docker compose up -d --build
